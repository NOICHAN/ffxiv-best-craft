# Render Blueprint —— src-server（網頁版的資料 API）。
#
# 這份是宣告式紀錄。實際服務是用 Render API 建立的，Render 不會自動套用 repo 內的
# render.yaml（除非在 dashboard 建立 Blueprint），所以兩邊的設定要保持一致。
#
# 已知限制：
#   - 只供 zh-CN，原因見 docker/server/config.render.toml 的註解。
#   - free plan 閒置 15 分鐘會休眠，之後第一個請求要等約一分鐘冷啟動。
#     healthCheckPath 只是部署時判定就緒用的，不會讓服務保持清醒。
#   - 資料庫烤在映像檔裡，換 xiv.db 必須重新部署。
services:
    - type: web
      name: bestcraft-datasource
      runtime: docker
      plan: free
      region: singapore
      branch: main
      dockerfilePath: ./docker/Dockerfile.server
      dockerContext: .
      healthCheckPath: /health
      autoDeploy: true
      # 只有後端相關的檔案變動才重建。少了這個，每次推前端的 commit 都會觸發
      # 一次十幾分鐘的 Rust 重建，白白吃掉 free plan 的額度。
      buildFilter:
          paths:
              - src-server/**
              - src-db/**
              - docker/Dockerfile.server
              - docker/server/config.render.toml
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain
              - .dockerignore
