# 把網頁版部署到 GitHub Pages。
#
# 與 build_web.yml 互不影響 —— 那份是上游用 SSH 推到自架站台的流程，只在打 tag 時部署。
#
# 這裡走的是「把產物推到 gh-pages 分支」的舊式發佈管線，而不是
# actions/deploy-pages 那條新的。原因：新管線在這個 repo 上會把部署卡在
# deployment_queued 直到逾時，GitHub 端始終沒有接手處理（產物與建置都正常）。
# 舊管線是完全不同的程式碼路徑。
#
# 前提：Settings → Pages → Source 要設成 Deploy from a branch，
#       分支選 gh-pages、目錄選 /(root)。
#
# 專案站台的網址是 https://<user>.github.io/<repo>/，所以要帶 base；
# 見 vite.config.ts 的 VITE_BASE_PATH。路由用的是 hash history，不需要 SPA fallback。
name: 'deploy_pages'
on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - name: setup node
              uses: actions/setup-node@v4
              with:
                  node-version: latest
                  cache: pnpm
            - run: corepack enable
            - name: install Rust nightly
              uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rust-src
                  targets: wasm32-unknown-unknown
            - name: install wasm-pack
              run: npm install -g wasm-pack
            # prebuild-web 會先用 -Z build-std 編 wasm，需要上面的 rust-src
            - name: install app dependencies and build it
              env:
                  VITE_BASE_PATH: /${{ github.event.repository.name }}/
              run: pnpm i && pnpm run build-web
            # 每次都以單一 commit 覆蓋 gh-pages，不留歷史 —— 產物十幾 MB，
            # 累積歷史只會把 repo 撐大，而舊版本本來就沒有保留的價值。
            - name: deploy to gh-pages branch
              env:
                  TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cd dist
                  touch .nojekyll
                  git init -q -b gh-pages
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -A
                  git commit -q -m "deploy ${GITHUB_SHA}"
                  git push -q --force \
                    "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                    gh-pages
